<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easyshot Pro Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #0f1016);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--tg-theme-secondary-bg-color, #1a1c24);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: var(--tg-theme-button-color, #ff3b5c);
            font-size: 22px;
            margin-bottom: 15px;
        }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: aspect-ratio 0.3s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .overlay-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
        }
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        .section-title {
            font-size: 13px;
            color: #a0a0b0;
            margin: 15px 0 8px 0;
            font-weight: 600;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .btn-group-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .btn {
            background: #2a2d3d;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            text-align: center;
        }
        .btn:hover, .btn.active {
            background: var(--tg-theme-button-color, #ff3b5c);
            color: var(--tg-theme-button-text-color, #fff);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #2a2d3d;
            border: 1px solid #3a3f58;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-top: 5px;
        }
        .file-input-label {
            display: block;
            background: #2a2d3d;
            border: 2px dashed #3a3f58;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--tg-theme-button-color, #ff3b5c);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Easyshot Pro</h1>

    <!-- Video Preview Section -->
    <div class="video-container" id="videoContainerBox">
        <video id="mainVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" controls playsinline></video>
        <div class="overlay-text" id="previewText">Easyshot</div>
        <div class="watermark" id="watermarkDisplay">Easyshot Pro</div>
    </div>

    <!-- Media Uploads -->
    <div class="section-title">MEDIA & AUDIO</div>
    <label class="file-input-label">
        📁 வீடியோவை மாற்றுக (Upload Video)
        <input type="file" id="videoUpload" accept="video/*" style="display: none;">
    </label>

    <label class="file-input-label">
        🎵 பேக்ரவுண்ட் மியூசிக் சேர் (Add BGM)
        <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
    </label>
    <audio id="bgMusic" loop></audio>

    <!-- Aspect Ratio / Crop Settings -->
    <div class="section-title">FRAME SIZE (ASPECT RATIO)</div>
    <div class="btn-group-3">
        <button class="btn active" onclick="changeAspectRatio('9/16', this)">Shorts 9:16</button>
        <button class="btn" onclick="changeAspectRatio('1/1', this)">Square 1:1</button>
        <button class="btn" onclick="changeAspectRatio('16/9', this)">Video 16:9</button>
    </div>

    <!-- Video Speed Settings -->
    <div class="section-title">VIDEO SPEED</div>
    <div class="btn-group-3">
        <button class="btn" onclick="changeSpeed(0.5, this)">0.5x Slow</button>
        <button class="btn active" onclick="changeSpeed(1.0, this)">1.0x Normal</button>
        <button class="btn" onclick="changeSpeed(1.5, this)">1.5x Fast</button>
    </div>

    <!-- Text & Watermark Settings -->
    <div class="section-title">TEXT & WATERMARK</div>
    <input type="text" id="textInput" placeholder="வீடியோ டெக்ஸ்ட் டைப் செய்யவும்..." value="Easyshot">
    
    <div class="section-title" style="margin-top: 10px;">CUSTOM WATERMARK</div>
    <input type="text" id="watermarkInput" placeholder="வாட்டர்மார்க் பெயர்..." value="Easyshot Pro">

    <!-- Color Filters -->
    <div class="section-title">COLOR FILTERS</div>
    <div class="btn-group">
        <button class="btn active" onclick="applyFilter('none', this)">Normal</button>
        <button class="btn" onclick="applyFilter('grayscale(100%)', this)">B&W</button>
        <button class="btn" onclick="applyFilter('sepia(100%)', this)">Sepia</button>
        <button class="btn" onclick="applyFilter('contrast(150%) saturate(150%)', this)">High Contrast</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    const video = document.getElementById('mainVideo');
    const videoContainerBox = document.getElementById('videoContainerBox');
    const bgMusic = document.getElementById('bgMusic');
    const textInput = document.getElementById('textInput');
    const previewText = document.getElementById('previewText');
    const watermarkInput = document.getElementById('watermarkInput');
    const watermarkDisplay = document.getElementById('watermarkDisplay');
    const videoUpload = document.getElementById('videoUpload');
    const audioUpload = document.getElementById('audioUpload');

    textInput.addEventListener('input', () => {
        previewText.textContent = textInput.value;
    });

    watermarkInput.addEventListener('input', () => {
        watermarkDisplay.textContent = watermarkInput.value;
        if(watermarkInput.value.trim() === '') {
            watermarkDisplay.style.display = 'none';
        } else {
            watermarkDisplay.style.display = 'block';
        }
    });

    videoUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.load();
        }
    });

    audioUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            bgMusic.src = URL.createObjectURL(file);
            bgMusic.load();
        }
    });

    video.addEventListener('play', () => { if(bgMusic.src) bgMusic.play(); });
    video.addEventListener('pause', () => { if(bgMusic.src) bgMusic.pause(); });
    video.addEventListener('seeked', () => { bgMusic.currentTime = video.currentTime; });

    function changeAspectRatio(ratio, btn) {
        videoContainerBox.style.aspectRatio = ratio;
        document.querySelectorAll('.btn-group-3')[0].querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function changeSpeed(rate, btn) {
        video.playbackRate = rate;
        const speedGroup = document.querySelectorAll('.btn-group-3')[1];
        if(speedGroup) {
            speedGroup.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        }
        btn.classList.add('active');
    }

    function applyFilter(filterStyle, btn) {
        video.style.filter = filterStyle;
        let parentGroup = btn.parentElement;
        parentGroup.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Telegram Main Button Setup
    tg.MainButton.text = "SEND VIDEO TO CHAT";
    tg.MainButton.color = tg.themeParams.button_color || "#ff3b5c";
    tg.MainButton.textColor = tg.themeParams.button_text_color || "#ffffff";
    tg.MainButton.show();

    Telegram.WebApp.onEvent('mainButtonClicked', function(){
        // Send data back to bot or close with confirmation
        tg.sendData(JSON.stringify({
            action: "export_video",
            video_url: video.src,
            text: textInput.value,
            watermark: watermarkInput.value
        }));
        tg.showAlert("உங்களது கோரிக்கை அனுப்பப்பட்டது! போட் சாட்டைப் பார்க்கவும்.");
        tg.close();
    });
</script>

</body>
        </html>
