<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easyshot Filmora Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121318;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1a1d24;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 15px;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        h1 {
            color: #ff4757;
            font-size: 18px;
            font-weight: bold;
        }
        .pro-badge {
            background: linear-gradient(45deg, #ff4757, #ffa502);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
        /* Filmora Canvas Preview */
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 9/16;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .overlay-text {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
        }
        .watermark {
            position: absolute;
            top: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 6px;
            border-radius: 4px;
        }
        /* Filmora Timeline UI */
        .timeline-box {
            background: #222632;
            border-radius: 8px;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid #2f3542;
        }
        .timeline-track {
            height: 28px;
            background: #2d3436;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 5px;
            overflow: hidden;
            cursor: pointer;
        }
        .timeline-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(255, 71, 87, 0.4);
            width: 0%;
            pointer-events: none;
        }
        .timeline-label {
            font-size: 11px;
            color: #a4b0be;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        /* Tools Section */
        .section-title {
            font-size: 12px;
            color: #747d8c;
            margin: 12px 0 6px 0;
            font-weight: 600;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .tool-btn {
            background: #252a34;
            color: #f1f2f6;
            border: 1px solid #2f3542;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            transition: 0.2s;
        }
        .tool-btn:hover, .tool-btn.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            background: #252a34;
            border: 1px solid #2f3542;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            margin-top: 4px;
        }
        .file-upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .upload-btn {
            background: #252a34;
            border: 1px dashed #ff4757;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            color: #ff4757;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>Easyshot Filmora</h1>
        <span class="pro-badge">PRO EDITOR</span>
    </div>

    <!-- Video Canvas -->
    <div class="video-container" id="videoContainerBox">
        <video id="mainVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" playsinline></video>
        <div class="overlay-text" id="previewText">Easyshot</div>
        <div class="watermark" id="watermarkDisplay">Filmora Pro</div>
    </div>

    <!-- Filmora Style Timeline -->
    <div class="timeline-box">
        <div class="timeline-label">
            <span id="currentTimeDisplay">0:00</span>
            <span>TIMELINE TRACK</span>
            <span id="durationDisplay">0:10</span>
        </div>
        <div class="timeline-track" id="timelineTrack">
            <div class="timeline-progress" id="timelineProgress"></div>
            <span style="font-size: 11px; z-index: 2; margin: auto; color: #dfe4ea;" id="playStatusText">▶ Tap to Play / Pause</span>
        </div>
    </div>

    <!-- Uploads -->
    <div class="file-upload-row">
        <label class="upload-btn">
            📁 Video மாற்று
            <input type="file" id="videoUpload" accept="video/*" style="display: none;">
        </label>
        <label class="upload-btn">
            🎵 BGM சேர்
            <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
        </label>
    </div>
    <audio id="bgMusic" loop></audio>

    <!-- Filmora Tools Panel -->
    <div class="section-title">ASPECT RATIO (FRAME)</div>
    <div class="tools-grid">
        <button class="tool-btn active" onclick="changeAspectRatio('9/16', this)">Shorts 9:16</button>
        <button class="tool-btn" onclick="changeAspectRatio('1/1', this)">Square 1:1</button>
        <button class="tool-btn" onclick="changeAspectRatio('16/9', this)">YouTube 16:9</button>
        <button class="tool-btn" onclick="changeAspectRatio('4/5', this)">Insta 4:5</button>
    </div>

    <div class="section-title">VIDEO SPEED</div>
    <div class="tools-grid">
        <button class="tool-btn" onclick="changeSpeed(0.5, this)">0.5x</button>
        <button class="tool-btn active" onclick="changeSpeed(1.0, this)">1.0x</button>
        <button class="tool-btn" onclick="changeSpeed(1.5, this)">1.5x</button>
        <button class="tool-btn" onclick="changeSpeed(2.0, this)">2.0x</button>
    </div>

    <div class="section-title">FILTERS & EFFECTS</div>
    <div class="tools-grid">
        <button class="tool-btn active" onclick="applyFilter('none', this)">Normal</button>
        <button class="tool-btn" onclick="applyFilter('grayscale(100%)', this)">B&W</button>
        <button class="tool-btn" onclick="applyFilter('sepia(100%)', this)">Sepia</button>
        <button class="tool-btn" onclick="applyFilter('contrast(160%)', this)">Contrast</button>
    </div>

    <div class="section-title">TEXT OVERLAY</div>
    <input type="text" id="textInput" placeholder="வீடியோ டெக்ஸ்ட்..." value="Easyshot">
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    const video = document.getElementById('mainVideo');
    const videoContainerBox = document.getElementById('videoContainerBox');
    const bgMusic = document.getElementById('bgMusic');
    const textInput = document.getElementById('textInput');
    const previewText = document.getElementById('previewText');
    const videoUpload = document.getElementById('videoUpload');
    const audioUpload = document.getElementById('audioUpload');
    const timelineTrack = document.getElementById('timelineTrack');
    const timelineProgress = document.getElementById('timelineProgress');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const durationDisplay = document.getElementById('durationDisplay');
    const playStatusText = document.getElementById('playStatusText');

    textInput.addEventListener('input', () => {
        previewText.textContent = textInput.value;
    });

    videoUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.load();
        }
    });

    audioUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            bgMusic.src = URL.createObjectURL(file);
            bgMusic.load();
        }
    });

    // Timeline Play/Pause Control
    timelineTrack.addEventListener('click', () => {
        if (video.paused) {
            video.play();
            if(bgMusic.src) bgMusic.play();
            playStatusText.textContent = "⏸ Playing...";
        } else {
            video.pause();
            if(bgMusic.src) bgMusic.pause();
            playStatusText.textContent = "▶ Tap to Play / Pause";
        }
    });

    video.addEventListener('timeupdate', () => {
        let current = video.currentTime;
        let duration = video.duration || 1;
        let percent = (current / duration) * 100;
        timelineProgress.style.width = percent + '%';
        
        let m = Math.floor(current / 60);
        let s = Math.floor(current % 60);
        currentTimeDisplay.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    });

    video.addEventListener('loadedmetadata', () => {
        let m = Math.floor(video.duration / 60);
        let s = Math.floor(video.duration % 60);
        durationDisplay.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    });

    function changeAspectRatio(ratio, btn) {
        videoContainerBox.style.aspectRatio = ratio;
        let parent = btn.parentElement;
        parent.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function changeSpeed(rate, btn) {
        video.playbackRate = rate;
        let parent = btn.parentElement;
        parent.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function applyFilter(filterStyle, btn) {
        video.style.filter = filterStyle;
        let parent = btn.parentElement;
        parent.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Telegram Export Button
    tg.MainButton.text = "EXPORT FILMORA PROJECT";
    tg.MainButton.color = tg.themeParams.button_color || "#ff4757";
    tg.MainButton.textColor = tg.themeParams.button_text_color || "#ffffff";
    tg.MainButton.show();

    Telegram.WebApp.onEvent('mainButtonClicked', function(){
        tg.sendData(JSON.stringify({
            action: "filmora_export",
            text: textInput.value
        }));
        tg.showAlert("உங்களது ஃபில்மோரா ப்ராஜெக்ட் வெற்றிகரமாக சேமிக்கப்பட்டது!");
        tg.close();
    });
</script>

</body>
    </html>
