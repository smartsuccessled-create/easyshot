    <!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easyshot WhatsApp Status Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121318;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1a1d24;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 15px;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        h1 {
            color: #25d366;
            font-size: 18px;
            font-weight: bold;
        }
        .pro-badge {
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: bold;
        }
        /* Mode Switch Tabs */
        .tabs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: #252a34;
            color: #a4b0be;
            border: 1px solid #2f3542;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }
        .tab-btn.active {
            background: #25d366;
            color: #fff;
            border-color: #25d366;
        }
        .section-box {
            display: none;
        }
        .section-box.active {
            display: block;
        }
        /* Video/Photo Canvas Preview */
        .preview-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 9/16;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-text {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            text-align: center;
            width: 90%;
            pointer-events: none;
        }
        .watermark {
            position: absolute;
            top: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 6px;
            border-radius: 4px;
        }
        .timeline-box {
            background: #222632;
            border-radius: 8px;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid #2f3542;
        }
        .timeline-track {
            height: 28px;
            background: #2d3436;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 5px;
            overflow: hidden;
            cursor: pointer;
        }
        .timeline-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(37, 211, 102, 0.4);
            width: 0%;
            pointer-events: none;
        }
        .timeline-label {
            font-size: 11px;
            color: #a4b0be;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .section-title {
            font-size: 12px;
            color: #747d8c;
            margin: 12px 0 6px 0;
            font-weight: 600;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .tool-btn {
            background: #252a34;
            color: #f1f2f6;
            border: 1px solid #2f3542;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            transition: 0.2s;
        }
        .tool-btn:hover, .tool-btn.active {
            background: #25d366;
            border-color: #25d366;
            color: #fff;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            background: #252a34;
            border: 1px solid #2f3542;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            margin-top: 4px;
        }
        .file-upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .upload-btn {
            background: #252a34;
            border: 1px dashed #25d366;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            color: #25d366;
        }
        .action-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        .download-action-btn {
            background: #2ed573;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        .export-action-btn {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
        /* Status Downloader specific */
        .status-input {
            width: 100%;
            padding: 10px;
            background: #252a34;
            border: 1px solid #2f3542;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>WhatsApp Status Hub</h1>
        <span class="pro-badge">WA TOOLS</span>
    </div>

    <!-- Mode Toggle Tabs -->
    <div class="tabs-row">
        <button class="tab-btn active" onclick="switchTab('edit', this)">✨ Status Editor</button>
        <button class="tab-btn" onclick="switchTab('download', this)">📥 Status Downloader</button>
    </div>

    <!-- TAB 1: STATUS EDITOR -->
    <div id="editSection" class="section-box active">
        <!-- Canvas Preview (Photo or Video) -->
        <div class="preview-container" id="previewContainerBox">
            <video id="mainVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" playsinline></video>
            <img id="mainImage" src="" style="display: none;" alt="Status Photo">
            <div class="overlay-text" id="previewText">My WhatsApp Status</div>
            <div class="watermark" id="watermarkDisplay">Status Pro</div>
        </div>

        <!-- Timeline (For Video) -->
        <div class="timeline-box" id="timelineBoxContainer">
            <div class="timeline-label">
                <span id="currentTimeDisplay">0:00</span>
                <span>STATUS TIMELINE</span>
                <span id="durationDisplay">0:10</span>
            </div>
            <div class="timeline-track" id="timelineTrack">
                <div class="timeline-progress" id="timelineProgress"></div>
                <span style="font-size: 11px; z-index: 2; margin: auto; color: #dfe4ea;" id="playStatusText">▶ Play / Pause</span>
            </div>
        </div>

        <!-- Media Uploads -->
        <div class="file-upload-row">
            <label class="upload-btn">
                🖼️ போட்டோ வை (Photo)
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            </label>
            <label class="upload-btn">
                📁 வீடியோ வை (Video)
                <input type="file" id="videoUpload" accept="video/*" style="display: none;">
            </label>
        </div>
        <audio id="bgMusic" loop></audio>

        <div class="section-title">STATUS FILTERS</div>
        <div class="tools-grid">
            <button class="tool-btn active" onclick="applyFilter('none', this)">Normal</button>
            <button class="tool-btn" onclick="applyFilter('grayscale(100%)', this)">B&W</button>
            <button class="tool-btn" onclick="applyFilter('sepia(100%)', this)">Sepia</button>
            <button class="tool-btn" onclick="applyFilter('contrast(150%)', this)">Pop</button>
        </div>

        <div class="section-title">ADD STATUS TEXT</div>
        <input type="text" id="textInput" placeholder="ஸ்டேட்டஸ் வாசகம்..." value="My WhatsApp Status">

        <!-- Action Buttons -->
        <div class="action-btn-row">
            <button class="download-action-btn" onclick="sendToBot('download')">📥 Send File</button>
            <button class="export-action-btn" onclick="sendToBot('export')">📤 Share Status</button>
        </div>
    </div>

    <!-- TAB 2: STATUS DOWNLOADER -->
    <div id="downloadSection" class="section-box">
        <div class="section-title">WHATSAPP STATUS DOWNLOADER</div>
        <p style="font-size: 12px; color: #a4b0be; margin-bottom: 10px;">
            நண்பர்களின் வாட்ஸ்அப் ஸ்டேட்டஸ் மீடியா லிங்க் அல்லது ஸ்டேட்டஸ் கோப்பினை கீழே உள்ளே பதிவிட்டு டவுன்லோட் செய்யுங்கள்:
        </p>
        <input type="text" class="status-input" placeholder="Paste Status Link / Text here...">
        <button class="export-action-btn" style="width: 100%; margin-top: 5px;" onclick="downloadStatusAction()">📥 Fetch & Download Status</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    const video = document.getElementById('mainVideo');
    const image = document.getElementById('mainImage');
    const timelineBoxContainer = document.getElementById('timelineBoxContainer');
    const bgMusic = document.getElementById('bgMusic');
    const textInput = document.getElementById('textInput');
    const previewText = document.getElementById('previewText');
    const videoUpload = document.getElementById('videoUpload');
    const imageUpload = document.getElementById('imageUpload');
    const timelineTrack = document.getElementById('timelineTrack');
    const timelineProgress = document.getElementById('timelineProgress');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const durationDisplay = document.getElementById('durationDisplay');
    const playStatusText = document.getElementById('playStatusText');

    function switchTab(tabName, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        if(tabName === 'edit') {
            document.getElementById('editSection').classList.add('active');
        } else {
            document.getElementById('downloadSection').classList.add('active');
        }
    }

    textInput.addEventListener('input', () => {
        previewText.textContent = textInput.value;
    });

    // Upload Video
    videoUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            image.style.display = 'none';
            video.style.display = 'block';
            timelineBoxContainer.style.display = 'block';
            video.src = URL.createObjectURL(file);
            video.load();
        }
    });

    // Upload Photo for Status
    imageUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            video.style.display = 'none';
            timelineBoxContainer.style.display = 'none';
            video.pause();
            image.style.display = 'block';
            image.src = URL.createObjectURL(file);
        }
    });

    timelineTrack.addEventListener('click', () => {
        if (video.paused) {
            video.play();
            playStatusText.textContent = "⏸ Playing...";
        } else {
            video.pause();
            playStatusText.textContent = "▶ Play / Pause";
        }
    });

    video.addEventListener('timeupdate', () => {
        let current = video.currentTime;
        let duration = video.duration || 1;
        let percent = (current / duration) * 100;
        timelineProgress.style.width = percent + '%';
        
        let m = Math.floor(current / 60);
        let s = Math.floor(current % 60);
        currentTimeDisplay.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    });

    video.addEventListener('loadedmetadata', () => {
        let m = Math.floor(video.duration / 60);
        let s = Math.floor(video.duration % 60);
        durationDisplay.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    });

    function applyFilter(filterStyle, btn) {
        video.style.filter = filterStyle;
        image.style.filter = filterStyle;
        let parent = btn.parentElement;
        parent.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function sendToBot(actionType) {
        tg.sendData(JSON.stringify({
            action: actionType,
            text: textInput.value
        }));
        tg.showAlert("உங்களது வாட்ஸ்அப் ஸ்டேட்டஸ் கோப்பு டெலிகிராம் பாட்டிற்கு அனுப்பப்படுகிறது!");
        tg.close();
    }

    function downloadStatusAction() {
        tg.showAlert("ஸ்டேட்டஸ் டவுன்லோட் கோரிக்கையானது பெறப்பட்டது!");
    }

    tg.MainButton.text = "SHARE WHATSAPP STATUS";
    tg.MainButton.color = "#25d366";
    tg.MainButton.textColor = "#ffffff";
    tg.MainButton.show();

    Telegram.WebApp.onEvent('mainButtonClicked', function(){
        sendToBot('export');
    });
</script>

</body>
</html>
