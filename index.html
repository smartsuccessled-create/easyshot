<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easyshot - Advanced Video Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1016;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1a1c24;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #ff3b5c;
            font-size: 22px;
            margin-bottom: 15px;
        }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, img.overlay-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .overlay-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
        }
        .watermark {
            position: absolute;
            top: 15px;
            right: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        .section-title {
            font-size: 14px;
            color: #a0a0b0;
            margin: 15px 0 8px 0;
            font-weight: 600;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .btn {
            background: #2a2d3d;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            text-align: center;
        }
        .btn:hover, .btn.active {
            background: #ff3b5c;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #2a2d3d;
            border: 1px solid #3a3f58;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-top: 5px;
        }
        .file-input-label {
            display: block;
            background: #2a2d3d;
            border: 2px dashed #3a3f58;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #ff3b5c;
            margin-bottom: 10px;
        }
        .download-btn {
            width: 100%;
            background: #ff3b5c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(255, 59, 92, 0.4);
        }
        .download-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Easyshot Pro Editor</h1>

    <!-- Video Preview Section -->
    <div class="video-container" id="videoContainer">
        <video id="mainVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" controls playsinline></video>
        <div class="overlay-text" id="previewText">Easyshot</div>
        <div class="watermark" id="watermarkDisplay">Easyshot Pro</div>
    </div>

    <!-- Media Uploads -->
    <div class="section-title">MEDIA & FILES</div>
    <label class="file-input-label">
        📁 வீடியோவை மாற்றுக (Upload Video)
        <input type="file" id="videoUpload" accept="video/*" style="display: none;">
    </label>

    <label class="file-input-label">
        🎵 பேக்ரவுண்ட் மியூசிக் சேர் (Add BGM)
        <input type="file" id="audioUpload" accept="audio/*" style="display: none;">
    </label>
    <audio id="bgMusic" loop></audio>

    <!-- Text & Watermark Settings -->
    <div class="section-title">TEXT & WATERMARK</div>
    <input type="text" id="textInput" placeholder="வீடியோ டெக்ஸ்ட் டைப் செய்யவும்..." value="Easyshot">
    
    <div class="section-title" style="margin-top: 10px;">CUSTOM WATERMARK</div>
    <input type="text" id="watermarkInput" placeholder="வாட்டர்மார்க் பெயர்..." value="Easyshot Pro">

    <!-- Color Filters -->
    <div class="section-title">COLOR FILTERS</div>
    <div class="btn-group">
        <button class="btn active" onclick="applyFilter('none', this)">Normal</button>
        <button class="btn" onclick="applyFilter('grayscale(100%)', this)">B&W</button>
        <button class="btn" onclick="applyFilter('sepia(100%)', this)">Sepia</button>
        <button class="btn" onclick="applyFilter('contrast(150%) saturate(150%)', this)">High Contrast</button>
    </div>

    <!-- Download Button -->
    <button class="download-btn" onclick="downloadVideo()">சேமி / Download (Mock)</button>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const bgMusic = document.getElementById('bgMusic');
    const textInput = document.getElementById('textInput');
    const previewText = document.getElementById('previewText');
    const watermarkInput = document.getElementById('watermarkInput');
    const watermarkDisplay = document.getElementById('watermarkDisplay');
    const videoUpload = document.getElementById('videoUpload');
    const audioUpload = document.getElementById('audioUpload');

    // Text Live Update
    textInput.addEventListener('input', () => {
        previewText.textContent = textInput.value;
    });

    // Watermark Live Update
    watermarkInput.addEventListener('input', () => {
        watermarkDisplay.textContent = watermarkInput.value;
        if(watermarkInput.value.trim() === '') {
            watermarkDisplay.style.display = 'none';
        } else {
            watermarkDisplay.style.display = 'block';
        }
    });

    // Video Upload Handler
    videoUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            video.src = url;
            video.load();
        }
    });

    // Audio Upload Handler (BGM)
    audioUpload.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            bgMusic.src = url;
            bgMusic.load();
        }
    });

    // Sync Audio with Video Play/Pause
    video.addEventListener('play', () => {
        if(bgMusic.src) bgMusic.play();
    });
    video.addEventListener('pause', () => {
        if(bgMusic.src) bgMusic.pause();
    });
    video.addEventListener('seeked', () => {
        bgMusic.currentTime = video.currentTime;
    });

    // Filters Handler
    function applyFilter(filterStyle, btn) {
        video.style.filter = filterStyle;
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Download Simulated Function
    function downloadVideo() {
        alert("உங்களது எடிட் செய்யப்பட்ட வீடியோ ஃபைல் ரெடியாகிறது! (Browser limitation காரணமாக டெமோ சேமிப்பு இயக்கப்பட்டுள்ளது).");
    }
</script>

</body>
    </html>
